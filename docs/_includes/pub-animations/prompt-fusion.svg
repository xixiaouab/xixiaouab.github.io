<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="pf-title pf-desc">
  <title id="pf-title">Layer-specific prompt fusion discovery</title>
  <desc id="pf-desc">Differentiable search chooses among addition, concatenation, affine transformation, and cross-attention at each frozen layer. Animated image and prompt tokens pass through illustrative layer-specific operator choices rather than one shared injection rule.</desc>
  <defs><marker id="pf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#243b53" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
  <style>
    .pf-text{font-family:Arial,sans-serif;fill:#243b53}.pf-title{font-size:24px;font-weight:700}.pf-label{font-size:20px;font-weight:600}.pf-small{font-size:18px}.pf-symbol{font-size:25px;font-weight:600}.pf-line{fill:none;stroke:#243b53;stroke-width:2.5;stroke-linecap:round;marker-end:url(#pf-arrow)}.pf-choice{fill:#f8fafc;stroke:#d8e2eb;stroke-width:1.5}
    .pf-chosen-one,.pf-chosen-two,.pf-chosen-three{fill:#e1edf8;stroke:#4479b5}.pf-chosen-one{animation:pf-search 7s ease-in-out infinite}.pf-chosen-two{animation:pf-search 7s ease-in-out -2.3s infinite}.pf-chosen-three{animation:pf-search 7s ease-in-out -4.6s infinite}.pf-image-one,.pf-prompt-one{animation:pf-flow-left 7s linear infinite}.pf-prompt-one{animation-delay:-.6s}.pf-image-two,.pf-prompt-two{animation:pf-flow-right 7s linear -2.3s infinite}.pf-prompt-two{animation-delay:-2.9s}.pf-image-three,.pf-prompt-three{animation:pf-flow-low 7s linear -4.6s infinite}.pf-prompt-three{animation-delay:-5.2s}
    @keyframes pf-search{0%,85%,100%{fill:#e1edf8;stroke:#4479b5}25%,60%{fill:#c1d9ef;stroke:#33998c}}
    @keyframes pf-flow-left{0%{transform:translate(0,0);opacity:0}10%{opacity:1}42%{transform:translate(-34px,52px);opacity:1}52%{transform:translate(-34px,52px);opacity:0}70%{transform:translate(0,132px);opacity:0}78%{transform:translate(0,132px);opacity:1}100%{transform:translate(0,142px);opacity:0}}
    @keyframes pf-flow-right{0%{transform:translate(0,0);opacity:0}10%{opacity:1}42%{transform:translate(34px,52px);opacity:1}52%{transform:translate(34px,52px);opacity:0}70%{transform:translate(0,132px);opacity:0}78%{transform:translate(0,132px);opacity:1}100%{transform:translate(0,142px);opacity:0}}
    @keyframes pf-flow-low{0%{transform:translate(0,0);opacity:0}10%{opacity:1}22%{transform:translate(0,22px);opacity:1}30%{transform:translate(0,22px);opacity:0}46%{transform:translate(34px,100px);opacity:0}54%{transform:translate(34px,100px);opacity:1}66%{transform:translate(34px,104px);opacity:0}76%{transform:translate(0,132px);opacity:0}83%{transform:translate(0,132px);opacity:1}100%{transform:translate(0,142px);opacity:0}}
    @media(prefers-reduced-motion:reduce){.pf-chosen-one,.pf-chosen-two,.pf-chosen-three,.pf-image-one,.pf-image-two,.pf-image-three,.pf-prompt-one,.pf-prompt-two,.pf-prompt-three{animation:none!important}}
  </style>
  <rect width="640" height="400" rx="18" fill="#f8fafc"/>
  <text class="pf-text pf-title" x="28" y="39">Layer-specific prompt fusion</text>
  <rect x="30" y="63" width="18" height="18" rx="4" fill="#4479b5"/><text class="pf-text pf-small" x="58" y="78">Image tokens</text>
  <rect x="222" y="63" width="18" height="18" rx="4" fill="#de9862"/><text class="pf-text pf-small" x="250" y="78">Prompt tokens</text>
  <text class="pf-text pf-small" x="608" y="78" text-anchor="end">Search per layer</text>
  <g>
    <rect x="24" y="101" width="184" height="231" rx="14" fill="white" stroke="#d8e2eb" stroke-width="2"/>
    <text class="pf-text pf-label" x="116" y="130" text-anchor="middle">Layer 1 · frozen</text>
    <path class="pf-line" d="M116 158V177M116 267V282"/>
    <rect class="pf-choice pf-chosen-one" x="44" y="182" width="64" height="40" rx="8"/><rect class="pf-choice" x="122" y="182" width="64" height="40" rx="8"/><rect class="pf-choice" x="44" y="231" width="64" height="40" rx="8"/><rect class="pf-choice" x="122" y="231" width="64" height="40" rx="8"/>
    <text class="pf-text pf-symbol" x="76" y="210" text-anchor="middle">+</text><text class="pf-text pf-symbol" x="154" y="210" text-anchor="middle">‖</text><text class="pf-text pf-symbol" x="76" y="259" text-anchor="middle">a</text><text class="pf-text pf-symbol" x="154" y="259" text-anchor="middle">↔</text>
    <text class="pf-text pf-label" x="116" y="311" text-anchor="middle">Add</text>
    <rect class="pf-image-one" x="103" y="143" width="12" height="12" rx="3" fill="#4479b5" stroke="white" stroke-width="1.5"/><rect class="pf-prompt-one" x="119" y="143" width="12" height="12" rx="3" fill="#de9862" stroke="white" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="228" y="101" width="184" height="231" rx="14" fill="white" stroke="#d8e2eb" stroke-width="2"/>
    <text class="pf-text pf-label" x="320" y="130" text-anchor="middle">Layer 2 · frozen</text>
    <path class="pf-line" d="M320 158V177M320 267V282"/>
    <rect class="pf-choice" x="248" y="182" width="64" height="40" rx="8"/><rect class="pf-choice pf-chosen-two" x="326" y="182" width="64" height="40" rx="8"/><rect class="pf-choice" x="248" y="231" width="64" height="40" rx="8"/><rect class="pf-choice" x="326" y="231" width="64" height="40" rx="8"/>
    <text class="pf-text pf-symbol" x="280" y="210" text-anchor="middle">+</text><text class="pf-text pf-symbol" x="358" y="210" text-anchor="middle">‖</text><text class="pf-text pf-symbol" x="280" y="259" text-anchor="middle">a</text><text class="pf-text pf-symbol" x="358" y="259" text-anchor="middle">↔</text>
    <text class="pf-text pf-label" x="320" y="311" text-anchor="middle">Concat</text>
    <rect class="pf-image-two" x="307" y="143" width="12" height="12" rx="3" fill="#4479b5" stroke="white" stroke-width="1.5"/><rect class="pf-prompt-two" x="323" y="143" width="12" height="12" rx="3" fill="#de9862" stroke="white" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="432" y="101" width="184" height="231" rx="14" fill="white" stroke="#d8e2eb" stroke-width="2"/>
    <text class="pf-text pf-label" x="524" y="130" text-anchor="middle">Layer 3 · frozen</text>
    <path class="pf-line" d="M524 158V177M524 267V282"/>
    <rect class="pf-choice" x="452" y="182" width="64" height="40" rx="8"/><rect class="pf-choice" x="530" y="182" width="64" height="40" rx="8"/><rect class="pf-choice" x="452" y="231" width="64" height="40" rx="8"/><rect class="pf-choice pf-chosen-three" x="530" y="231" width="64" height="40" rx="8"/>
    <text class="pf-text pf-symbol" x="484" y="210" text-anchor="middle">+</text><text class="pf-text pf-symbol" x="562" y="210" text-anchor="middle">‖</text><text class="pf-text pf-symbol" x="484" y="259" text-anchor="middle">a</text><text class="pf-text pf-symbol" x="562" y="259" text-anchor="middle">↔</text>
    <text class="pf-text pf-label" x="524" y="311" text-anchor="middle">Cross-attention</text>
    <rect class="pf-image-three" x="511" y="143" width="12" height="12" rx="3" fill="#4479b5" stroke="white" stroke-width="1.5"/><rect class="pf-prompt-three" x="527" y="143" width="12" height="12" rx="3" fill="#de9862" stroke="white" stroke-width="1.5"/>
  </g>
  <text class="pf-text pf-small" x="320" y="362" text-anchor="middle">+ Add   ·   ‖ Concat   ·   a Affine   ·   ↔ Cross-attention</text>
  <text class="pf-text pf-small" x="320" y="388" text-anchor="middle">Illustrative search choices across frozen layers</text>
</svg>
