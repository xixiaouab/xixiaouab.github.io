<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="li-title li-desc" id="li-root">
  <title id="li-title">Layer-wise information allocation with Prompted Information Bottlenecks</title>
  <desc id="li-desc">Task-relevant teal tokens pass through three frozen transformer layers with learned prompts. Orange shortcut information is progressively filtered and diverted, illustrating what the representations retain and suppress across layers. The illustration is conceptual and contains no measured results.</desc>
  <style>
    #li-root text{font-family:Arial,sans-serif;fill:#243b53}
    .li-heading{font-size:24px;font-weight:700}.li-subtitle{font-size:20px}.li-label{font-size:20px;font-weight:700}.li-small{font-size:18px}
    .li-panel{fill:white;stroke:#d5dfe8;stroke-width:2}.li-path{fill:none;stroke:#a4b4c4;stroke-width:3;stroke-linecap:round}.li-prompt{fill:#eee9f4;stroke:#927bb4;stroke-width:2}
    .li-flow{fill:#33998c;stroke:white;stroke-width:2;opacity:0;animation:li-pass 7.4s linear infinite}.li-flow-b{animation-delay:-3.7s}
    .li-reject{fill:#de9862;stroke:white;stroke-width:2;opacity:0;animation:li-filter 7.4s ease-in-out infinite}
    .li-focus{fill:none;stroke:#33998c;stroke-width:3;opacity:.18;animation:li-focus 7.4s ease-in-out infinite}.li-focus-b{animation-delay:-2.45s}.li-focus-c{animation-delay:-4.9s}
    @keyframes li-pass{0%{transform:translateX(0);opacity:0}8%{opacity:1}81%{transform:translateX(498px);opacity:1}88%,100%{transform:translateX(498px);opacity:0}}
    @keyframes li-filter{0%,32%{transform:translateY(0);opacity:0}39%{opacity:1}62%{transform:translateY(89px);opacity:1}74%,100%{transform:translateY(89px);opacity:0}}
    @keyframes li-focus{0%,13%,100%{opacity:.16}26%,38%{opacity:.9}53%,88%{opacity:.16}}
    @media(prefers-reduced-motion:reduce){.li-flow,.li-reject,.li-focus{animation:none!important}.li-flow,.li-reject{opacity:0}}
  </style>
  <defs>
    <marker id="li-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#a4b4c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="li-orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#de9862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="400" rx="22" fill="#f8fafc"/>
  <text x="320" y="36" text-anchor="middle" class="li-heading">Layer-wise information allocation</text>
  <text x="320" y="64" text-anchor="middle" class="li-subtitle">Prompted Information Bottlenecks</text>
  <rect x="24" y="88" width="174" height="208" rx="18" class="li-panel"/>
  <rect x="233" y="88" width="174" height="208" rx="18" class="li-panel"/>
  <rect x="442" y="88" width="174" height="208" rx="18" class="li-panel"/>
  <rect x="24" y="88" width="174" height="208" rx="18" class="li-focus"/>
  <rect x="233" y="88" width="174" height="208" rx="18" class="li-focus li-focus-b"/>
  <rect x="442" y="88" width="174" height="208" rx="18" class="li-focus li-focus-c"/>
  <g text-anchor="middle">
    <text x="111" y="121" class="li-label">Layer 1</text><text x="320" y="121" class="li-label">Layer 2</text><text x="529" y="121" class="li-label">Layer 3</text>
    <text x="111" y="147" class="li-small">Frozen</text><text x="320" y="147" class="li-small">Frozen</text><text x="529" y="147" class="li-small">Frozen</text>
  </g>
  <rect x="52" y="165" width="118" height="32" rx="9" class="li-prompt"/><rect x="261" y="165" width="118" height="32" rx="9" class="li-prompt"/><rect x="470" y="165" width="118" height="32" rx="9" class="li-prompt"/>
  <g class="li-small" text-anchor="middle"><text x="111" y="187">Prompt</text><text x="320" y="187">Prompt</text><text x="529" y="187">Prompt</text></g>
  <path d="M44 232H594" class="li-path" marker-end="url(#li-arrow)"/>
  <g stroke="white" stroke-width="2">
    <circle cx="70" cy="232" r="10" fill="#33998c"/><circle cx="97" cy="232" r="10" fill="#33998c"/><circle cx="124" cy="232" r="10" fill="#de9862"/><circle cx="151" cy="232" r="10" fill="#de9862"/>
    <circle cx="288" cy="232" r="10" fill="#33998c"/><circle cx="316" cy="232" r="10" fill="#33998c"/><circle cx="350" cy="232" r="10" fill="#de9862"/>
    <circle cx="510" cy="232" r="10" fill="#33998c"/><circle cx="542" cy="232" r="10" fill="#33998c"/>
  </g>
  <g class="li-small" text-anchor="middle"><text x="111" y="277">Mixed evidence</text><text x="320" y="277">Regulate</text><text x="529" y="277">Task evidence</text></g>
  <path d="M350 246H391V321" fill="none" stroke="#de9862" stroke-width="3" stroke-dasharray="5 6" marker-end="url(#li-orange-arrow)"/>
  <circle cx="48" cy="232" r="8" class="li-flow"/><circle cx="48" cy="232" r="8" class="li-flow li-flow-b"/>
  <circle cx="391" cy="244" r="8" class="li-reject"/>
  <rect x="205" y="331" width="230" height="43" rx="12" fill="#fbf1e9"/>
  <circle cx="226" cy="352" r="7" fill="#de9862"/><text x="245" y="358" class="li-small">Suppress shortcuts</text>
  <circle cx="40" cy="352" r="7" fill="#33998c"/><text x="59" y="358" class="li-small">Retain</text>
  <path d="m484 352 12 12 24-26" fill="none" stroke="#33998c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="535" y="358" class="li-small">Adapt</text>
</svg>
