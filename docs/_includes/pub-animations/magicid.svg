<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="mi-title mi-desc">
  <title id="mi-title">MagicID: identity-consistent video with preserved dynamics</title>
  <desc id="mi-desc">A reference identity appears in three video frames whose poses change over time while the face remains consistent. Paired preferences feed a hybrid optimization process that balances identity and dynamics. The drawing is a conceptual schematic, not generated video evidence.</desc>
  <style>
    .mi-bg{fill:#f8fafc}.mi-panel{fill:#fff;stroke:#d9e2ec;stroke-width:2}.mi-text{font-family:Arial,sans-serif;fill:#243b53}.mi-title{font-size:24px;font-weight:700}.mi-label{font-size:20px}.mi-small{font-size:18px}.mi-line{fill:none;stroke:#a8b7c7;stroke-width:3;stroke-linecap:round}.mi-face{fill:#f6e0cc;stroke:#243b53;stroke-width:2}.mi-shirt{fill:#a8c6e8;stroke:#4479b5;stroke-width:2}.mi-arm{fill:none;stroke:#4479b5;stroke-width:9;stroke-linecap:round;transform-box:fill-box;transform-origin:0% 100%;animation:mi-pose 7s ease-in-out infinite}.mi-arm2{animation-delay:-2.3s}.mi-arm3{animation-delay:-4.6s}.mi-outline{fill:none;stroke:#33998c;stroke-width:3;opacity:.25;animation:mi-frame 7s infinite}.mi-outline2{animation-delay:-4.66s}.mi-outline3{animation-delay:-2.33s}.mi-flow{fill:none;stroke:#927bb4;stroke-width:4;stroke-linecap:round;stroke-dasharray:7 12;animation:mi-flow 7s linear infinite}.mi-identity{fill:#33998c;opacity:.35;animation:mi-pref 7s ease-in-out infinite}.mi-dynamics{fill:#de9862;opacity:.35;animation:mi-pref 7s ease-in-out -3.5s infinite}
    @keyframes mi-pose{0%,100%{transform:rotate(0deg)}35%,65%{transform:rotate(-35deg)}}@keyframes mi-frame{0%,26%{opacity:1}36%,92%{opacity:.2}100%{opacity:1}}@keyframes mi-flow{to{stroke-dashoffset:-152}}@keyframes mi-pref{0%,100%{opacity:.35}25%,60%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.mi-arm,.mi-outline,.mi-flow,.mi-identity,.mi-dynamics{animation:none}.mi-outline{opacity:.7}.mi-identity,.mi-dynamics{opacity:.8}.mi-arm2{transform:rotate(-18deg)}.mi-arm3{transform:rotate(-35deg)}}
  </style>
  <defs><marker id="mi-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#a8b7c7" stroke-width="2"/></marker><g id="mi-person"><path class="mi-shirt" d="M-27 42Q-25 20-13 18H13Q25 20 27 42V59H-27Z"/><path d="M-17-11Q-16-27 1-27 20-27 19-9V7H-18Z" fill="#243b53"/><ellipse class="mi-face" cx="0" cy="0" rx="15" ry="20"/><path d="M-15-8Q-12-23 1-23 16-22 16-6L8-17Q-2-11-15-8Z" fill="#243b53"/><circle cx="-5" cy="0" r="1.7" fill="#243b53"/><circle cx="6" cy="0" r="1.7" fill="#243b53"/><path d="M-4 9Q1 13 7 8" fill="none" stroke="#b87d62" stroke-width="2" stroke-linecap="round"/></g></defs>
  <rect class="mi-bg" width="640" height="400" rx="16"/>
  <text class="mi-text mi-title" x="28" y="37">MagicID</text>
  <text class="mi-text mi-label" x="28" y="66">Keep the identity. Preserve the motion.</text>
  <rect class="mi-panel" x="26" y="101" width="122" height="159" rx="15"/>
  <use href="#mi-person" transform="translate(87 159)"/>
  <text class="mi-text mi-small" x="87" y="244" text-anchor="middle">Reference ID</text>
  <path class="mi-line" d="M153 178H181" marker-end="url(#mi-arrow)"/>
  <rect class="mi-panel" x="192" y="101" width="422" height="159" rx="15"/>
  <rect x="206" y="114" width="117" height="111" rx="9" fill="#edf3f8"/>
  <rect x="345" y="114" width="117" height="111" rx="9" fill="#edf3f8"/>
  <rect x="484" y="114" width="117" height="111" rx="9" fill="#edf3f8"/>
  <use href="#mi-person" transform="translate(264 157)"/><path class="mi-arm" d="M285 181L299 162"/>
  <use href="#mi-person" transform="translate(403 157)"/><path class="mi-arm mi-arm2" d="M424 181L438 162"/>
  <use href="#mi-person" transform="translate(542 157)"/><path class="mi-arm mi-arm3" d="M563 181L577 162"/>
  <rect class="mi-outline" x="206" y="114" width="117" height="111" rx="9"/><rect class="mi-outline mi-outline2" x="345" y="114" width="117" height="111" rx="9"/><rect class="mi-outline mi-outline3" x="484" y="114" width="117" height="111" rx="9"/>
  <text class="mi-text mi-small" x="403" y="247" text-anchor="middle">Consistent ID across video frames</text>
  <path class="mi-flow" d="M403 264V287H321V307"/>
  <rect x="26" y="307" width="588" height="68" rx="15" fill="#eee9f5"/>
  <rect class="mi-identity" x="43" y="324" width="114" height="34" rx="9"/>
  <text class="mi-text mi-small" x="100" y="347" text-anchor="middle" fill="#fff">Identity</text>
  <text class="mi-text mi-small" x="181" y="336">Paired preferences</text>
  <text class="mi-text mi-small" x="181" y="360">Hybrid optimization</text>
  <rect class="mi-dynamics" x="481" y="324" width="116" height="34" rx="9"/>
  <text class="mi-text mi-small" x="539" y="347" text-anchor="middle">Dynamics</text>
</svg>
