<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="vi-title vi-desc" id="vi-root">
  <title id="vi-title">Visual Instance-aware Prompt Tuning</title>
  <desc id="vi-desc">An image-conditioned encoder generates teal instance-aware prompts. They combine with purple dataset-level prompts before entering frozen transformer layers. PCA-based propagation carries useful prompt information between layers. Moving tokens follow this sequence without suggesting numerical performance.</desc>
  <style>
    #vi-root text{font-family:Arial,sans-serif;fill:#243b53}.vi-heading{font-size:24px;font-weight:700}.vi-subtitle{font-size:20px}.vi-label{font-size:20px;font-weight:700}.vi-small{font-size:18px}.vi-panel{fill:white;stroke:#d5dfe8;stroke-width:2}.vi-wire{fill:none;stroke:#a4b4c4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.vi-model{fill:#edf3f8;stroke:#a4b4c4;stroke-width:2}
    .vi-encode{animation:vi-encode 7.6s ease-in-out infinite}.vi-instance{animation:vi-instance 7.6s ease-in-out infinite}.vi-merge-token{fill:#33998c;stroke:white;stroke-width:2;opacity:0;animation:vi-merge 7.6s linear infinite}.vi-pca-token{fill:#927bb4;stroke:white;stroke-width:2;opacity:0;animation:vi-propagate 7.6s linear infinite}.vi-pca{animation:vi-pca 7.6s ease-in-out infinite}
    @keyframes vi-encode{0%,100%{stroke:#a4b4c4}9%,21%{stroke:#33998c}32%,90%{stroke:#a4b4c4}}
    @keyframes vi-instance{0%,100%{fill-opacity:.5}18%,46%{fill-opacity:1}69%,90%{fill-opacity:.5}}
    @keyframes vi-merge{0%,25%{transform:translate(420px,210px);opacity:0}31%{transform:translate(420px,210px);opacity:1}37%{transform:translate(420px,240px);opacity:1}55%{transform:translate(125px,240px);opacity:1}63%{transform:translate(125px,277px);opacity:0}100%{transform:translate(125px,277px);opacity:0}}
    @keyframes vi-propagate{0%,60%{transform:translateX(0);opacity:0}64%{opacity:1}88%{transform:translateX(218px);opacity:1}96%,100%{transform:translateX(218px);opacity:0}}
    @keyframes vi-pca{0%,64%,100%{stroke:#927bb4;fill:#f0ebf6}76%,86%{stroke:#33998c;fill:#e4f2ef}}
    @media(prefers-reduced-motion:reduce){.vi-encode,.vi-instance,.vi-merge-token,.vi-pca-token,.vi-pca{animation:none!important}.vi-merge-token,.vi-pca-token{opacity:0}}
  </style>
  <defs><marker id="vi-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a4b4c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="640" height="400" rx="22" fill="#f8fafc"/>
  <text x="320" y="36" text-anchor="middle" class="vi-heading">Visual instance-aware prompting</text><text x="320" y="65" text-anchor="middle" class="vi-subtitle">Generate, combine, and propagate prompts</text>
  <rect x="24" y="85" width="592" height="270" rx="18" class="vi-panel"/>
  <rect x="42" y="115" width="75" height="53" rx="7" fill="#e8f0f6" stroke="#a4b4c4" stroke-width="2"/><path d="m47 160 20-26 17 17 12-11 16 20" fill="#a6cec5"/><circle cx="100" cy="126" r="6" fill="#de9862"/>
  <text x="79" y="194" text-anchor="middle" class="vi-small">Image</text>
  <path d="M124 142H146" class="vi-wire" marker-end="url(#vi-arrow)"/>
  <rect x="157" y="115" width="125" height="53" rx="12" fill="#e4f2ef" stroke="#a4b4c4" stroke-width="2.5" class="vi-encode"/>
  <text x="219" y="137" text-anchor="middle" class="vi-small">Instance</text><text x="219" y="158" text-anchor="middle" class="vi-small">encoder</text>
  <path d="M291 142H313" class="vi-wire" marker-end="url(#vi-arrow)"/>
  <text x="353" y="110" text-anchor="middle" class="vi-small">Instance</text><g fill="#33998c" class="vi-instance"><rect x="322" y="125" width="17" height="34" rx="4"/><rect x="345" y="125" width="17" height="34" rx="4"/><rect x="368" y="125" width="17" height="34" rx="4"/></g>
  <text x="525" y="110" text-anchor="middle" class="vi-small">Dataset</text><g fill="#927bb4"><rect x="494" y="125" width="17" height="34" rx="4"/><rect x="517" y="125" width="17" height="34" rx="4"/><rect x="540" y="125" width="17" height="34" rx="4"/></g>
  <path d="M353 170 397 196M525 170 446 196" class="vi-wire" marker-end="url(#vi-arrow)"/>
  <rect x="350" y="197" width="140" height="30" rx="9" fill="#f8fafc" stroke="#d5dfe8" stroke-width="2"/>
  <g fill="#33998c"><rect x="361" y="203" width="17" height="18" rx="3"/><rect x="384" y="203" width="17" height="18" rx="3"/></g><g fill="#927bb4"><rect x="438" y="203" width="17" height="18" rx="3"/><rect x="461" y="203" width="17" height="18" rx="3"/></g>
  <text x="420" y="219" text-anchor="middle" class="vi-small">+</text>
  <path d="M420 230V240H125V272" class="vi-wire" marker-end="url(#vi-arrow)"/>
  <text x="187" y="224" class="vi-small">Combined prompts</text>
  <rect x="42" y="281" width="167" height="54" rx="12" class="vi-model"/><text x="125" y="304" text-anchor="middle" class="vi-small">Frozen layer 1</text><g fill="#33998c"><rect x="104" y="314" width="16" height="10" rx="3"/></g><g fill="#927bb4"><rect x="130" y="314" width="16" height="10" rx="3"/></g>
  <path d="M218 308H261" class="vi-wire" marker-end="url(#vi-arrow)"/>
  <rect x="273" y="281" width="94" height="54" rx="12" fill="#f0ebf6" stroke="#927bb4" stroke-width="2.5" class="vi-pca"/><text x="320" y="314" text-anchor="middle" class="vi-label">PCA</text>
  <path d="M378 308H420" class="vi-wire" marker-end="url(#vi-arrow)"/>
  <rect x="432" y="281" width="167" height="54" rx="12" class="vi-model"/><text x="515" y="304" text-anchor="middle" class="vi-small">Frozen layer 2</text><g fill="#33998c"><rect x="494" y="314" width="16" height="10" rx="3"/></g><g fill="#927bb4"><rect x="520" y="314" width="16" height="10" rx="3"/></g>
  <circle r="7" class="vi-merge-token"/><rect x="213" y="301" width="14" height="14" rx="4" class="vi-pca-token"/>
  <text x="320" y="382" text-anchor="middle" class="vi-subtitle">Preserve useful prompting information</text>
</svg>
